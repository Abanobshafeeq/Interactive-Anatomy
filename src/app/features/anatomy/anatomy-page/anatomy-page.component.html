<div class="anatomy-page">
  <label class="mobile-organ-picker">
    Organ
    <select [value]="selectedOrgan().id" (change)="selectOrganById($any($event.target).value)">
      @for (organ of organs; track organ.id) {
        <option [value]="organ.id">{{ organ.name }}</option>
      }
    </select>
  </label>

    <div class="brand">

      </div>
    </div>

    <div class="header-status">
      <span class="status-dot"></span>
      Anatomy Explorer
    </div>
  </header> -->

  <main class="anatomy-content">
    <app-organ-list
      class="organ-list-component"
      [selectedOrgan]="selectedOrgan()"
      (organSelected)="selectOrgan($event)"
    />

    <app-organ-viewer
      class="organ-viewer-component"
      [organ]="selectedOrgan()"
    />

    <app-organ-info
      class="organ-info-component"
      [organ]="selectedOrgan()"
    />
  </main>
</div>
